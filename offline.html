<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#102A43"
  >

  <title>
    Offline — Quoriya
  </title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f9fc;
      color: #102a43;
    }

    .card {
      max-width: 520px;
      padding: 42px;
      text-align: center;
      background: white;
      border: 1px solid #dde5ef;
      border-radius: 28px;
      box-shadow:
        0 20px 60px rgba(16,42,67,.10);
    }

    .logo {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: #102a43;
      color: white;
      font-size: 32px;
      font-weight: 800;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.7;
      color: #62748a;
    }

    button {
      margin-top: 18px;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: #102a43;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

  </style>

</head>


<body>

  <div class="card">

    <div class="logo">
      Q
    </div>

    <h1>
      You're offline.
    </h1>

    <p>
      Quoriya can't reach the internet right now,
      but cached lessons may still be available.
    </p>

    <button
      onclick="location.href='index.html'"
    >
      Open Quoriya
    </button>

  </div>

</body>

</html>
