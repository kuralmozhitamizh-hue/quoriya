<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Quoriya Content Studio"
  >

  <title>Content Studio — Quoriya</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/admin.css"
  >

</head>

<body>

<div class="admin-shell">

  <!-- LOGIN -->

  <section id="loginView" class="login-view">

    <div class="login-card">

      <div class="brand admin-brand">

        <span class="brand-mark">Q</span>

        <span>Quoriya</span>

      </div>

      <span class="eyebrow">
        Content Studio
      </span>

      <h1>
        Welcome back.
      </h1>

      <p>
        Sign in to create, edit and publish Quoriya topics.
      </p>

      <form id="loginForm">

        <label>
          Email

          <input
            id="loginEmail"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          >

        </label>

        <label>
          Password

          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Your password"
          >

        </label>

        <button
          class="admin-primary"
          type="submit"
        >
          Sign in
        </button>

      </form>

      <button
        id="resetPassword"
        class="text-button"
        type="button"
      >
        Forgot password?
      </button>

      <p
        id="loginMessage"
        class="admin-message"
      ></p>

    </div>

  </section>


  <!-- STUDIO -->

  <section
    id="studioView"
    class="studio-view"
    hidden
  >

    <header class="studio-header">

      <div>

        <div class="brand">

          <span class="brand-mark">Q</span>

          <span>Quoriya</span>

        </div>

        <p class="studio-subtitle">
          Real Content Studio
        </p>

      </div>

      <div class="studio-user">

        <span id="currentUser"></span>

        <button
          id="logoutButton"
          class="admin-secondary"
          type="button"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="studio-main">

      <!-- SIDEBAR -->

      <aside class="studio-sidebar">

        <button
          id="newTopicButton"
          class="admin-primary"
          type="button"
        >
          + New topic
        </button>

        <div class="studio-filter">

          <input
            id="topicSearch"
            type="search"
            placeholder="Search topics..."
          >

        </div>

        <div
          id="topicList"
          class="topic-list"
        ></div>

      </aside>


      <!-- EDITOR -->

      <section class="editor-area">

        <div class="editor-toolbar">

          <div>

            <span class="eyebrow">
              Topic editor
            </span>

            <h1 id="editorHeading">
              Create a topic
            </h1>

          </div>

          <div class="toolbar-actions">

            <button
              id="previewButton"
              class="admin-secondary"
              type="button"
            >
              Preview
            </button>

            <button
              id="saveDraftButton"
              class="admin-secondary"
              type="button"
            >
              Save draft
            </button>

            <button
              id="publishButton"
              class="admin-primary"
              type="button"
            >
              Publish
            </button>

          </div>

        </div>


        <form id="topicForm" class="topic-form">

          <input
            id="topicDocumentId"
            type="hidden"
          >


          <div class="form-grid">

            <label>
              Title

              <input
                id="topicTitle"
                type="text"
                required
                placeholder="Curvature"
              >

            </label>


            <label>
              Topic ID

              <input
                id="topicId"
                type="text"
                required
                placeholder="curvature"
              >

            </label>


            <label>
              Category

              <input
                id="topicCategory"
                type="text"
                value="Mathematics"
              >

            </label>


            <label>
              Type

              <select id="topicType">

                <option>
                  Concept guide
                </option>

                <option>
                  Visual lesson
                </option>

                <option>
                  Problem set
                </option>

                <option>
                  Formula guide
                </option>

                <option>
                  General guide
                </option>

              </select>

            </label>


            <label>
              Read time

              <input
                id="topicReadTime"
                type="text"
                value="8 min"
              >

            </label>


            <label>
              Tags

              <input
                id="topicTags"
                type="text"
                placeholder="calculus, geometry, visual"
              >

            </label>

          </div>


          <label>

            Description

            <textarea
              id="topicDescription"
              rows="4"
              placeholder="What will the learner understand?"
            ></textarea>

          </label>


          <label>

            Related topic IDs

            <input
              id="topicRelated"
              type="text"
              placeholder="derivatives, differential-calculus"
            >

          </label>


          <!-- CONTENT BLOCKS -->

          <section class="blocks-section">

            <div class="blocks-header">

              <div>

                <span class="eyebrow">
                  Content
                </span>

                <h2>
                  Learning blocks
                </h2>

              </div>

              <div class="block-buttons">

                <button
                  type="button"
                  data-add-block="text"
                  class="block-add"
                >
                  + Explanation
                </button>

                <button
                  type="button"
                  data-add-block="formula"
                  class="block-add"
                >
                  + Formula
                </button>

                <button
                  type="button"
                  data-add-block="note"
                  class="block-add"
                >
                  + Note
                </button>

                <button
                  type="button"
                  data-add-block="story"
                  class="block-add"
                >
                  + Story
                </button>

                <button
                  type="button"
                  data-add-block="problem"
                  class="block-add"
                >
                  + Problem
                </button>

                <button
                  type="button"
                  data-add-block="gallery"
                  class="block-add"
                >
                  + Gallery
                </button>

                <button
                  type="button"
                  data-add-block="media"
                  class="block-add"
                >
                  + Media
                </button>

              </div>

            </div>


            <div
              id="blocksContainer"
              class="blocks-container"
            >

              <div class="empty-blocks">
                Add an Explanation, Formula, Story, Problem or media block.
              </div>

            </div>

          </section>


          <div
            id="editorMessage"
            class="editor-message"
          ></div>

        </form>

      </section>

    </main>

  </section>

</div>


<!-- PREVIEW MODAL -->

<div
  id="previewModal"
  class="preview-modal"
  hidden
>

  <div class="preview-window">

    <div class="preview-header">

      <strong>
        Topic Preview
      </strong>

      <button
        id="closePreview"
        class="admin-secondary"
        type="button"
      >
        Close
      </button>

    </div>

    <iframe
      id="previewFrame"
      title="Topic preview"
    ></iframe>

  </div>

</div>


<script
  type="module"
  src="js/admin.js"
></script>

</body>

</html>
